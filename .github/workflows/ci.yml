# Checks every push and pull request: types, lint, the access-rule tests against a throwaway
# Postgres, the scraper's tests, and a production build. In Vercel, turn on
# Settings → Git → "Wait for checks" (or a GitHub branch protection rule on main requiring this
# workflow) so a red check stops a deploy from reaching students.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (types, lint, access tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aicd3_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # a throwaway database inside this job; never a Neon URL (the tests empty it)
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aicd3_test
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/aicd3_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      # Next.js's build cache, kept between runs (before install, so the source hash skips node_modules)
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx', '**/*.mts', '**/*.css') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Create the test database's tables from the migrations
        run: pnpm prisma migrate deploy
      - name: Access-rule tests
        run: pnpm test
      - name: Production build
        run: pnpm build

  scraper:
    name: Scraper tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - name: Unit tests
        working-directory: scraper
        run: python -m unittest test_pharma_internships test_extract test_check_open test_pipeline test_d3 test_progress
